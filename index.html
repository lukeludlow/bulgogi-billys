<!doctype html>
<html
    lang="en"
    class="bg-white lg:bg-zinc-100 dark:bg-zinc-900 dark:lg:bg-zinc-950"
>
    <head>
        <meta charset="UTF-8" />
        <link
            rel="icon"
            type="image/png"
            href="/src/assets/bulgogi_billys_icon.png"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- title, description, canonical and the og:/twitter: tags are rendered
             per page by PageMeta, and prerendered into each page's HTML at build
             time (scripts/prerender.ts) -->
        <meta property="og:site_name" content="Bulgogi Billy's" />
        <script>
            (function () {
                var isDark =
                    localStorage.theme === "dark" ||
                    (!("theme" in localStorage) &&
                        window.matchMedia("(prefers-color-scheme: dark)")
                            .matches);
                if (isDark) document.documentElement.classList.add("dark");
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
